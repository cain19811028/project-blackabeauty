<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 950" width="100%" height="100%">
<defs>
  
<linearGradient id="iceBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#E0F2FE"/>
  <stop offset="35%" stop-color="#BAE6FD"/>
  <stop offset="70%" stop-color="#7DD3FC"/>
  <stop offset="100%" stop-color="#38BDF8"/>
</linearGradient>
<linearGradient id="yellowTrimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#FEF08A"/>
  <stop offset="50%" stop-color="#FACC15"/>
  <stop offset="100%" stop-color="#CA8A04"/>
</linearGradient>

  <radialGradient id="groundShadow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#000000" stop-opacity="0.25"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
  </radialGradient>
  <filter id="shirtShadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
  </filter>
</defs>

<ellipse cx="400" cy="910" rx="280" ry="20" fill="url(#groundShadow)"/>

<!-- Mannequin Neck -->
<ellipse cx="400" cy="245" rx="45" ry="18" fill="#F1E3D3" stroke="#D1B89D" stroke-width="1.5"/>

<!-- Short Sleeves -->
<path d="M 285 280 L 180 390 L 245 425 L 325 360 Z" fill="url(#iceBlueGrad)" stroke="#0284C7" stroke-width="1.5"/>
<path d="M 180 390 L 245 425 L 240 440 L 175 405 Z" fill="url(#yellowTrimGrad)" stroke="#A16207" stroke-width="1"/>

<path d="M 515 280 L 620 390 L 555 425 L 475 360 Z" fill="url(#iceBlueGrad)" stroke="#0284C7" stroke-width="1.5"/>
<path d="M 620 390 L 555 425 L 560 440 L 625 405 Z" fill="url(#yellowTrimGrad)" stroke="#A16207" stroke-width="1"/>

<!-- Main Shirt Body -->
<path d="M 320 280 C 360 270 440 270 480 280 L 495 720 C 440 735 360 735 305 720 Z" 
      fill="url(#iceBlueGrad)" stroke="#0284C7" stroke-width="2" filter="url(#shirtShadow)"/>

<!-- Bottom Hem Yellow Border -->
<path d="M 305 710 C 360 725 440 725 495 710 L 495 730 C 440 745 360 745 305 730 Z" 
      fill="url(#yellowTrimGrad)" stroke="#A16207" stroke-width="1.2"/>

<!-- Side Vents (開衩) -->
<line x1="305" y1="650" x2="305" y2="720" stroke="#0369A1" stroke-width="3"/>
<line x1="495" y1="650" x2="495" y2="720" stroke="#0369A1" stroke-width="3"/>

<!-- Mandarin Collar -->
<path d="M 355 270 C 355 245 445 245 445 270 L 440 285 C 410 280 390 280 360 285 Z" 
      fill="url(#iceBlueGrad)" stroke="url(#yellowTrimGrad)" stroke-width="2.5"/>

<!-- Center Placket Seam -->
<line x1="400" y1="280" x2="400" y2="725" stroke="#0284C7" stroke-width="2"/>

<!-- Traditional Handcrafted Frog Buttons (手工布盤扣) -->

    <g id="frog-button-310">
      <!-- Left loop -->
      <path d="M 390 310 C 370 300 370 320 390 310" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
      <circle cx="378" cy="310" r="2" fill="#BAE6FD"/>
