      <path d="M 410 310 C 430 300 430 320 410 310" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
      <circle cx="400" cy="310" r="4.5" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.2"/>
    </g>
    
    <g id="frog-button-380">
