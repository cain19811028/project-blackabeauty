<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 950" width="100%" height="100%">

    <defs>
      <!-- Ground Shadow Gradient -->
      <radialGradient id="groundShadow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#000000" stop-opacity="0.32"/>
        <stop offset="60%" stop-color="#000000" stop-opacity="0.12"/>
        <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
      </radialGradient>

      <!-- Ghost Acrylic Mannequin Gradient -->
      <linearGradient id="acrylicGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="rgba(255,255,255,0.45)"/>
        <stop offset="25%" stop-color="rgba(255,255,255,0.15)"/>
        <stop offset="75%" stop-color="rgba(255,255,255,0.1)"/>
        <stop offset="100%" stop-color="rgba(255,255,255,0.35)"/>
      </linearGradient>

      <!-- Cap Gradients -->
      <linearGradient id="capCylinderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#141720"/>
        <stop offset="30%" stop-color="#222633"/>
        <stop offset="70%" stop-color="#222633"/>
        <stop offset="100%" stop-color="#10121A"/>
      </linearGradient>
      <linearGradient id="boardTopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#2D3342"/>
        <stop offset="45%" stop-color="#1C202B"/>
        <stop offset="100%" stop-color="#11141C"/>
      </linearGradient>
      <linearGradient id="tamVelvetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#2C303E"/>
        <stop offset="50%" stop-color="#181B24"/>
        <stop offset="100%" stop-color="#0C0E14"/>
      </linearGradient>

      <!-- Velvet Panels / Chevrons Gradient -->
      <linearGradient id="velvetGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#0A0B10"/>
        <stop offset="40%" stop-color="#0D0F14"/>
        <stop offset="70%" stop-color="#0D0F14"/>
        <stop offset="100%" stop-color="#07080B"/>
      </linearGradient>

      <!-- Plum Blossom 24K Gold Gradient -->
      <linearGradient id="goldMetalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFF8D6"/>
        <stop offset="25%" stop-color="#FCD34D"/>
        <stop offset="55%" stop-color="#F59E0B"/>
        <stop offset="85%" stop-color="#D97706"/>
        <stop offset="100%" stop-color="#92400E"/>
      </linearGradient>
      <linearGradient id="goldInnerGrad" x1="100%" y1="100%" x2="0%" y2="0%">
        <stop offset="0%" stop-color="#D97706"/>
        <stop offset="40%" stop-color="#FBBF24"/>
        <stop offset="100%" stop-color="#FFFBEB"/>
      </linearGradient>

      <!-- Gold Tassel Bullion Gradient -->
      <linearGradient id="goldTasselGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#B45309"/>
        <stop offset="30%" stop-color="#FCD34D"/>
        <stop offset="70%" stop-color="#F59E0B"/>
        <stop offset="100%" stop-color="#78350F"/>
      </linearGradient>

      <!-- Stole & Tassel Custom Gradients -->
      
<linearGradient id="hoodLiningLeft" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#FFFBEB"/>
  <stop offset="30%" stop-color="#FCD34D"/>
  <stop offset="70%" stop-color="#F59E0B"/>
  <stop offset="100%" stop-color="#B45309"/>
</linearGradient>
<linearGradient id="hoodLiningRight" x1="100%" y1="0%" x2="0%" y2="100%">
  <stop offset="0%" stop-color="#FFFBEB"/>
  <stop offset="30%" stop-color="#FCD34D"/>
  <stop offset="70%" stop-color="#F59E0B"/>
  <stop offset="100%" stop-color="#B45309"/>
</linearGradient>

      
<linearGradient id="tasselGrad" x1="0%" y1="0%" x2="100%" y2="0%">
  <stop offset="0%" stop-color="#FFFBEB"/>
  <stop offset="40%" stop-color="#FBBF24"/>
  <stop offset="100%" stop-color="#D97706"/>
</linearGradient>

      
        <linearGradient id="robeBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#222631"/>
          <stop offset="25%" stop-color="#161821"/>
          <stop offset="70%" stop-color="#0E1016"/>
          <stop offset="100%" stop-color="#07080B"/>
        </linearGradient>
        <linearGradient id="sleeveGradLeft" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#242833"/>
          <stop offset="40%" stop-color="#181B24"/>
          <stop offset="100%" stop-color="#0C0D13"/>
        </linearGradient>
        <linearGradient id="sleeveGradRight" x1="100%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#242833"/>
          <stop offset="40%" stop-color="#181B24"/>
          <stop offset="100%" stop-color="#0C0D13"/>
        </linearGradient>
        
      

      <!-- Filters -->
      <filter id="goldDropShadow" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.45"/>
      </filter>
      <filter id="capShadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
      </filter>
      <filter id="velvetShadow" x="-10%" y="-10%" width="120%" height="120%">
        <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.5"/>
      </filter>
    </defs>
    

    <!-- Ground Soft Shadow -->
    <ellipse cx="400" cy="910" rx="310" ry="24" fill="url(#groundShadow)"/>

    <!-- Ghost Mannequin Acrylic Support -->
    <g id="ghost-acrylic-stand">
      <path d="M 385 235 L 385 300 C 385 308 415 308 415 300 L 415 235 Z" 
            fill="url(#acrylicGrad)" stroke="rgba(255,255,255,0.4)" stroke-width="1.2"/>
      <ellipse cx="400" cy="235" rx="15" ry="3" fill="rgba(255,255,255,0.5)"/>
    </g>

    <!-- Inner Collar Cavity with deep dark lining -->
    <ellipse cx="400" cy="305" rx="65" ry="24" fill="#0C0E14" stroke="#1F2430" stroke-width="2"/>
    

    <!-- Sleeves Layer -->
    <g id="gown-sleeves">
      
        <!-- Left Master Oblong Sleeve -->
        <path d="M 255 315 C 210 400 160 520 150 670 C 145 770 230 780 290 750 C 315 735 330 680 335 480 Z" 
              fill="url(#sleeveGradLeft)" stroke="#0E1016" stroke-width="1.5"/>
        <path d="M 155 640 C 150 730 220 745 280 720" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>

        <!-- Right Master Oblong Sleeve -->
        <path d="M 545 315 C 590 400 640 520 650 670 C 655 770 570 780 510 750 C 485 735 470 680 465 480 Z" 
              fill="url(#sleeveGradRight)" stroke="#0E1016" stroke-width="1.5"/>
        <path d="M 645 640 C 650 730 580 745 520 720" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
        
    </g>

    <!-- Main Gown Robe Body -->
    <g id="gown-body">
      <!-- Robe Body Base Silhouette -->
      <path d="M 250 315 C 290 280 340 280 400 285 C 460 280 510 280 550 315 
               C 535 450 530 650 535 885 C 490 895 400 900 400 900 C 400 900 310 895 265 885 
               C 270 650 265 450 250 315 Z" 
            fill="url(#robeBodyGrad)" stroke="#0E1016" stroke-width="2"/>

      <!-- Vertical Gravity Draping Folds -->
      <path d="M 335 345 C 340 500 335 720 330 890" stroke="rgba(0,0,0,0.4)" stroke-width="4" fill="none"/>
      <path d="M 340 345 C 345 500 340 720 335 890" stroke="rgba(255,255,255,0.06)" stroke-width="2" fill="none"/>

      <path d="M 370 355 C 375 510 372 730 370 893" stroke="rgba(0,0,0,0.35)" stroke-width="3" fill="none"/>
      <path d="M 373 355 C 378 510 375 730 373 893" stroke="rgba(255,255,255,0.05)" stroke-width="1.5" fill="none"/>

      <path d="M 430 355 C 425 510 428 730 430 893" stroke="rgba(0,0,0,0.35)" stroke-width="3" fill="none"/>
      <path d="M 427 355 C 422 510 425 730 427 893" stroke="rgba(255,255,255,0.05)" stroke-width="1.5" fill="none"/>

      <path d="M 465 345 C 460 500 465 720 470 890" stroke="rgba(0,0,0,0.4)" stroke-width="4" fill="none"/>
      <path d="M 460 345 C 455 500 460 720 465 890" stroke="rgba(255,255,255,0.06)" stroke-width="2" fill="none"/>

      <!-- Center Zipper / Placket Seam -->
      <line x1="400" y1="330" x2="400" y2="898" stroke="#000000" stroke-width="2.5"/>
      <line x1="401" y1="330" x2="401" y2="898" stroke="rgba(255,255,255,0.08)" stroke-width="1.2"/>

      <!-- Shoulder Yoke Pleats / Gathers -->
      <path d="M 285 300 Q 295 335 300 360 M 310 292 Q 318 335 320 365 M 490 292 Q 482 335 480 365 M 515 300 Q 505 335 500 360" 
            stroke="rgba(0,0,0,0.5)" stroke-width="2" fill="none"/>
      <path d="M 287 300 Q 297 335 302 360 M 312 292 Q 320 335 322 365 M 488 292 Q 480 335 478 365 M 513 300 Q 503 335 498 360" 
            stroke="rgba(255,255,255,0.08)" stroke-width="1.2" fill="none"/>
    </g>
    

    <!-- Master / Doctor Academic Hood (碩博士大披肩) -->
    <g id="academic-hood" filter="url(#goldDropShadow)">
      <!-- Black Outer Shoulder Cape Base -->
      <path d="M 230 330 C 215 420 300 485 365 485 C 400 485 400 485 435 485 C 500 485 585 420 570 330 
               C 525 295 465 288 400 288 C 335 288 275 295 230 330 Z" 
            fill="#0F1117" stroke="#000000" stroke-width="2"/>
      <!-- Soft fabric sheen on outer cape -->
      <path d="M 240 340 C 230 405 295 465 355 465" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="3"/>
      <path d="M 560 340 C 570 405 505 465 445 465" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="3"/>

      <!-- Wide Turn-over Collar revealing Lustrous College Satin Lining -->
      <!-- Left Turnover -->
      <path d="M 315 288 Q 400 380 400 440 L 400 470 Q 360 410 245 330 Z" 
            fill="url(#hoodLiningLeft)" stroke="#000000" stroke-width="1"/>

      <!-- Right Turnover -->
      <path d="M 485 288 Q 400 380 400 440 L 400 470 Q 440 410 555 330 Z" 
            fill="url(#hoodLiningRight)" stroke="#000000" stroke-width="1"/>

      <!-- Center Meeting Seam -->
      <line x1="400" y1="440" x2="400" y2="470" stroke="rgba(0,0,0,0.3)" stroke-width="1.5"/>
    </g>
    

    <!-- Signature Golden Plum Blossom Rosette Brooch Clasp (金色梅花胸扣) -->
    <g id="plum-blossom-clasp" filter="url(#goldDropShadow)">
      <!-- 5 Petals -->
    
        <circle cx="400.00" cy="347.24" r="11.44" fill="url(#goldMetalGrad)" stroke="#78350F" stroke-width="1.2"/>
        <circle cx="400.00" cy="347.24" r="8.58" fill="url(#goldInnerGrad)" opacity="0.85"/>
        
        <circle cx="412.14" cy="356.06" r="11.44" fill="url(#goldMetalGrad)" stroke="#78350F" stroke-width="1.2"/>
        <circle cx="412.14" cy="356.06" r="8.58" fill="url(#goldInnerGrad)" opacity="0.85"/>
        
        <circle cx="407.50" cy="370.32" r="11.44" fill="url(#goldMetalGrad)" stroke="#78350F" stroke-width="1.2"/>
        <circle cx="407.50" cy="370.32" r="8.58" fill="url(#goldInnerGrad)" opacity="0.85"/>
        
        <circle cx="392.50" cy="370.32" r="11.44" fill="url(#goldMetalGrad)" stroke="#78350F" stroke-width="1.2"/>
        <circle cx="392.50" cy="370.32" r="8.58" fill="url(#goldInnerGrad)" opacity="0.85"/>
        
        <circle cx="387.86" cy="356.06" r="11.44" fill="url(#goldMetalGrad)" stroke="#78350F" stroke-width="1.2"/>
        <circle cx="387.86" cy="356.06" r="8.58" fill="url(#goldInnerGrad)" opacity="0.85"/>
        
      <!-- Central Core & Stamens -->
      <circle cx="400" cy="360" r="10.56" fill="url(#goldMetalGrad)" stroke="#78350F" stroke-width="1.5"/>
      <circle cx="400" cy="360" r="6.16" fill="#FFFBEB"/>
    <circle cx="404.14" cy="354.30" r="1.5" fill="#451A03"/>
<circle cx="406.70" cy="362.18" r="1.5" fill="#451A03"/>
<circle cx="400.00" cy="367.04" r="1.5" fill="#451A03"/>
<circle cx="393.30" cy="362.18" r="1.5" fill="#451A03"/>
<circle cx="395.86" cy="354.30" r="1.5" fill="#451A03"/>

    </g>
    

    <!-- Academic Mortarboard Cap -->
    <g id="academic-cap" filter="url(#capShadow)">
      <!-- Cylinder headband -->
      <path d="M 305 160 L 495 160 L 490 236 C 490 252 310 252 310 236 Z" fill="url(#capCylinderGrad)"/>
      <path d="M 310 236 C 310 252 490 252 490 236" fill="none" stroke="#2D3748" stroke-width="1.5"/>
      <ellipse cx="400" cy="236" rx="90" ry="12" fill="none" stroke="#1A202C" stroke-width="2.5" opacity="0.6"/>
      
      <!-- Top diamond board -->
      <polygon points="400,118 595,145 400,174 205,145" fill="url(#boardTopGrad)" stroke="#262D38" stroke-width="2"/>
      <polygon points="205,145 400,174 400,179 205,150" fill="#0D0F14"/>
      <polygon points="400,174 595,145 595,150 400,179" fill="#181B22"/>
      
      <!-- Center button -->
      <ellipse cx="400" cy="146" rx="6" ry="4" fill="#2D3748" stroke="#0D0F14" stroke-width="1.2"/>
      
      <!-- Tassel cord draped over edge -->
      <path d="M 400 146 Q 490 144 576 150" fill="none" stroke="#F59E0B" stroke-width="3.2" stroke-linecap="round"/>
      
      <!-- Tassel hanging assembly -->
      <g id="tassel-hanging">
        <circle cx="576" cy="150" r="3.5" fill="#FCD34D"/>
        <path d="M 576 150 Q 577 185 577 215" fill="none" stroke="#F59E0B" stroke-width="2.8"/>
        <rect x="571" y="215" width="12" height="7" rx="3" fill="#FCD34D" stroke="#4A5568" stroke-width="0.8"/>
        <!-- Tassel brush -->
        <path d="M 572 222 L 567 360 C 572 365 582 365 587 360 L 582 222 Z" fill="url(#tasselGrad)"/>
        <!-- Fine fringe lines -->
        <path d="M 570 230 L 568 360 M 574 230 L 574 363 M 577 230 L 578 364 M 581 230 L 583 361" 
              stroke="#FCD34D" stroke-width="0.8" opacity="0.65"/>
      </g>
    </g>
        
</svg>