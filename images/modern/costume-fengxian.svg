<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 950" width="100%" height="100%">
<defs>
  
<linearGradient id="pinkSilkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#FCE7F3"/>
  <stop offset="35%" stop-color="#F472B6"/>
  <stop offset="70%" stop-color="#EC4899"/>
  <stop offset="100%" stop-color="#DB2777"/>
</linearGradient>
<linearGradient id="goldBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#FFFBEB"/>
  <stop offset="50%" stop-color="#F59E0B"/>
  <stop offset="100%" stop-color="#D97706"/>
</linearGradient>
<linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#86EFAC"/>
  <stop offset="100%" stop-color="#16A34A"/>
</linearGradient>

  <radialGradient id="groundShadow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#000000" stop-opacity="0.25"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
  </radialGradient>
  <filter id="costumeShadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
  </filter>
</defs>

<ellipse cx="400" cy="910" rx="280" ry="20" fill="url(#groundShadow)"/>

<!-- Mannequin Bust Neck -->
<ellipse cx="400" cy="245" rx="45" ry="18" fill="#F1E3D3" stroke="#D1B89D" stroke-width="1.5"/>

<!-- Long Pleated Satin Skirt -->
<path d="M 330 570 L 270 890 C 350 905 450 905 530 890 L 470 570 Z" 
      fill="url(#pinkSilkGrad)" stroke="#BE185D" stroke-width="2"/>
<!-- Vertical Skirt Pleat Highlights -->
<path d="M 320 600 L 290 890 M 360 580 L 340 895 M 400 575 L 400 898 M 440 580 L 460 895 M 480 600 L 510 890" 
      stroke="rgba(255,255,255,0.25)" stroke-width="2" fill="none"/>

<!-- Fengxian Blouse Sleeves -->
<path d="M 285 280 L 175 460 L 255 490 L 325 360 Z" fill="url(#pinkSilkGrad)" stroke="#BE185D" stroke-width="1.5"/>
<path d="M 175 460 L 255 490 L 245 505 L 165 475 Z" fill="url(#goldBorderGrad)" stroke="#B45309" stroke-width="1"/>

<path d="M 515 280 L 625 460 L 545 490 L 475 360 Z" fill="url(#pinkSilkGrad)" stroke="#BE185D" stroke-width="1.5"/>
<path d="M 625 460 L 545 490 L 555 505 L 635 475 Z" fill="url(#goldBorderGrad)" stroke="#B45309" stroke-width="1"/>

<!-- Fengxian Blouse Bodice -->
<path d="M 320 280 C 360 270 440 270 480 280 L 490 560 C 440 575 360 575 310 560 Z" 
      fill="url(#pinkSilkGrad)" stroke="#BE185D" stroke-width="2" filter="url(#costumeShadow)"/>

<!-- Hem Gold Border -->
<path d="M 310 550 C 360 565 440 565 490 550 L 490 568 C 440 583 360 583 310 568 Z" 
      fill="url(#goldBorderGrad)" stroke="#B45309" stroke-width="1.2"/>

<!-- Traditional Mandarin Standing Collar with Gold Trim -->
<path d="M 355 270 C 355 245 445 245 445 270 L 440 285 C 410 280 390 280 360 285 Z" 
      fill="url(#pinkSilkGrad)" stroke="url(#goldBorderGrad)" stroke-width="2.5"/>

<!-- Center Asymmetric Chinese Cloud Collar Yoke & Border -->
<path d="M 350 280 C 400 285 450 285 450 280 C 465 330 450 360 400 370 C 350 360 335 330 350 280 Z" 
      fill="none" stroke="url(#goldBorderGrad)" stroke-width="3"/>

<!-- Delicate Peony Blossom & Branch Embroidery (手工刺繡牡丹花) -->
<g id="peony-embroidery">
  <!-- Foliage & Branches -->
  <path d="M 380 430 Q 395 400 420 390 Q 435 370 450 360" stroke="#15803D" stroke-width="2.5" fill="none"/>
  <!-- Leaves -->
  <path d="M 390 415 C 405 410 410 425 390 415 Z" fill="url(#leafGrad)"/>
  <path d="M 425 385 C 440 380 445 395 425 385 Z" fill="url(#leafGrad)"/>
  <!-- Peony Petals -->
  <circle cx="380" cy="435" r="18" fill="#F43F5E" opacity="0.9"/>
  <circle cx="375" cy="430" r="14" fill="#FB7185"/>
  <circle cx="385" cy="438" r="10" fill="#FFE4E6"/>
  <circle cx="380" cy="435" r="4" fill="#FCD34D"/>
</g>
</svg>