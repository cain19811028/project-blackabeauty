<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 950" width="100%" height="100%">
<defs>
  
<linearGradient id="childrenRobeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#2D3342"/>
  <stop offset="40%" stop-color="#1A202C"/>
  <stop offset="100%" stop-color="#0F1117"/>
</linearGradient>
<linearGradient id="redAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#F87171"/>
  <stop offset="40%" stop-color="#EF4444"/>
  <stop offset="100%" stop-color="#B91C1C"/>
</linearGradient>

  <radialGradient id="groundShadow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#000000" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
  </radialGradient>
  <filter id="childShadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/>
  </filter>
</defs>

<ellipse cx="400" cy="910" rx="300" ry="22" fill="url(#groundShadow)"/>

<!-- Robe Sleeves -->
<path d="M 255 350 C 220 420 180 540 170 710 L 305 735 C 320 650 330 530 335 480 Z" fill="#1A202C" stroke="#000000" stroke-width="1.5"/>
<path d="M 545 350 C 580 420 620 540 630 710 L 495 735 C 480 650 470 530 465 480 Z" fill="#1A202C" stroke="#000000" stroke-width="1.5"/>

<!-- 3 Red Chevrons on each sleeve -->
<g filter="url(#childShadow)">
  <path d="M 195 470 Q 240 480 280 495 L 275 515 Q 235 500 190 490 Z" fill="url(#redAccentGrad)"/>
  <path d="M 185 530 Q 230 540 270 555 L 265 575 Q 225 560 180 550 Z" fill="url(#redAccentGrad)"/>
  <path d="M 175 590 Q 220 600 260 615 L 255 635 Q 215 620 170 610 Z" fill="url(#redAccentGrad)"/>

  <path d="M 605 470 Q 560 480 520 495 L 525 515 Q 565 500 610 490 Z" fill="url(#redAccentGrad)"/>
  <path d="M 615 530 Q 570 540 530 555 L 535 575 Q 575 560 620 550 Z" fill="url(#redAccentGrad)"/>
  <path d="M 625 590 Q 580 600 540 615 L 545 635 Q 585 620 630 610 Z" fill="url(#redAccentGrad)"/>
</g>

<!-- Robe Body -->
<path d="M 260 340 C 300 320 345 320 400 325 C 455 320 500 320 540 340 
         C 530 460 525 650 530 885 C 485 895 400 900 400 900 C 400 900 315 895 270 885 
         C 275 650 270 460 260 340 Z" fill="#141720" stroke="#000000" stroke-width="2"/>

<!-- Red Center Placket Panel -->
<rect x="365" y="340" width="70" height="555" fill="url(#redAccentGrad)" stroke="#991B1B" stroke-width="1.5" filter="url(#childShadow)"/>

<!-- Red V-Stole Trim -->
<path d="M 315 330 L 400 500 L 485 330 L 445 330 L 400 435 L 355 330 Z" fill="url(#redAccentGrad)" filter="url(#childShadow)"/>

<!-- White Inner Shirt Collar -->
<polygon points="345,290 400,340 400,320 370,290" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
<polygon points="455,290 400,340 400,320 430,290" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>

<!-- Red Mini Tie -->
<g filter="url(#childShadow)">
  <!-- Tie Knot -->
  <polygon points="390,340 410,340 406,358 394,358" fill="#DC2626" stroke="#991B1B" stroke-width="0.8"/>
  <!-- Tie Blade -->
  <polygon points="394,358 406,358 412,440 400,460 388,440" fill="url(#redAccentGrad)" stroke="#991B1B" stroke-width="0.8"/>
</g>

<!-- Red Round Beret Tam Hat -->
<g filter="url(#childShadow)">
  <!-- Tam Headband -->
  <ellipse cx="400" cy="235" rx="85" ry="18" fill="#991B1B"/>
  <!-- Puffy Beret Crown -->
  <path d="M 280 220 C 260 175 300 135 355 125 C 385 120 415 120 445 125 C 500 135 540 175 520 220 C 490 250 310 250 280 220 Z" 
        fill="url(#redAccentGrad)" stroke="#B91C1C" stroke-width="2"/>
  <!-- Top Button & Tassel -->
  <circle cx="400" cy="120" r="7" fill="#B91C1C"/>
  <path d="M 400 120 Q 480 135 515 190" fill="none" stroke="#DC2626" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="515" cy="190" r="4" fill="#EF4444"/>
  <path d="M 515 190 Q 518 240 518 280" fill="none" stroke="#DC2626" stroke-width="2.5"/>
  <path d="M 514 280 L 510 335 C 515 340 521 340 526 335 L 522 280 Z" fill="#B91C1C"/>
</g>
</svg>